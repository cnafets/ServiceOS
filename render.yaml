# Staging deployment blueprint. Connect this repo/branch in Render manually.
services:
  - type: web
    name: ynm-serviceos-staging
    runtime: docker
    plan: starter
    branch: feature/quo-webhook-foundation
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: staging
      - key: INTEGRATION_TEST_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: ynm-serviceos-staging-db
          property: connectionString
      - key: STAGING_ACCESS_TOKEN
        sync: false
      - key: QUO_WEBHOOK_SIGNING_SECRET
        sync: false
databases:
  - name: ynm-serviceos-staging-db
    plan: basic-256mb
    databaseName: serviceos_staging
    user: serviceos_staging
